[package]
name = "praxis-core"
description = "Praxis façade: the stable public API over every trust-kernel crate, used by the CLI, praxisd, WASM and FFI bindings (docs/ARCHITECTURE.md §3)."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "praxis_core"

[dependencies]
praxis-types = { path = "../praxis-types", version = "0.1.0" }
praxis-crypto = { path = "../praxis-crypto", version = "0.1.0" }
praxis-identity = { path = "../praxis-identity", version = "0.1.0" }
praxis-validate = { path = "../praxis-validate", version = "0.1.0" }
praxis-store = { path = "../praxis-store", version = "0.1.0" }
praxis-policy = { path = "../praxis-policy", version = "0.1.0" }
praxis-score = { path = "../praxis-score", version = "0.1.0" }
praxis-surprise = { path = "../praxis-surprise", version = "0.1.0" }
praxis-sync = { path = "../praxis-sync", version = "0.1.0" }
