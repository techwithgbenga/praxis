# SPDX-License-Identifier: Apache-2.0
[package]
name = "praxis-types"
description = "Praxis protocol: scalar newtypes, object envelope, and content enums. No I/O, no deps on other praxis-* crates (docs/ARCHITECTURE.md §3)."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "praxis_types"

[dependencies]
blake3 = "1.5.5"
ipld-core = { version = "0.4.3", features = ["std", "serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11.15"
serde_ipld_dagcbor = "0.7.0"
thiserror = "2.0.9"
unicode-normalization = "0.1.24"

[dev-dependencies]
serde_json = "1.0.137"
proptest = "1.6.0"
