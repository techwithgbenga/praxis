# SPDX-License-Identifier: Apache-2.0
[package]
name = "praxis-validate"
description = "Praxis protocol: the reference validator (spec/PROTOCOL.md §12) — canonical decode, identity/signature resolution, causal/lifecycle rules C1-C8."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "praxis_validate"

[dependencies]
praxis-types = { path = "../praxis-types", version = "0.1.0" }
praxis-crypto = { path = "../praxis-crypto", version = "0.1.0" }
praxis-identity = { path = "../praxis-identity", version = "0.1.0" }
thiserror = "2.0.9"

[dev-dependencies]
hex = "0.4.3"
ipld-core = { version = "0.4.3", features = ["std", "serde"] }
rand = "0.8.5"
serde_ipld_dagcbor = "0.7.0"
serde_json = "1.0.137"
