# Domain pack: software incident response / SRE / database operations
# SPDX-License-Identifier: CC-BY-4.0
id: incident-response
version: 0.1.0
title: Incident Response (SRE & Database Operations)
risk_tier: moderate           # bounded stakes; not life-critical
license: CC-BY-4.0
maintainers: []               # TODO: appoint 3+ practitioner stewards (see DOMAIN_PACKS.md §2)
governance: "Changes approved by pack stewards; minor=additive, major=breaking vocabulary."

situation_fields:             # stored in situation.context; NO floats (decimals as {m,e})
  - { name: service,          type: string,  required: true }
  - { name: incident_phase,   type: enum,    required: true,
      values: [detection, triage, mitigation, recovery, postmortem] }
  - { name: customer_impact,  type: enum,    required: true, values: [none, degraded, partial_outage, full_outage] }
  - { name: on_call_role,     type: enum,    required: false, values: [primary, secondary, incident_commander, observer] }
  - { name: recent_change,    type: bool,    required: false }
  - { name: runbook_exists,   type: bool,    required: false }

signal_vocabulary:            # canonical names enable retrieval + contrastive questions
  - { name: replica_lag,         unit: s }
  - { name: error_rate,          unit: ppm }
  - { name: latency_p99,         unit: ms }
  - { name: cpu_saturation,      unit: ppm }
  - { name: queue_depth,         unit: count }
  - { name: alert_fired,         unit: bool }
  - { name: deploy_recent,       unit: bool }
  - { name: backup_job_running,  unit: bool }
  - { name: dependency_degraded, unit: bool }

situation_types:
  - id: database_replication_lag
    option_sets:
      - [wait_and_watch, failover, restart_replica, throttle_writes, escalate, rollback_recent_change]
  - id: elevated_error_rate
    option_sets:
      - [rollback, feature_flag_off, scale_out, wait_and_watch, failover_region, escalate, mitigate_dependency]
  - id: capacity_saturation
    option_sets:
      - [scale_out, shed_load, throttle_clients, wait_and_watch, escalate]

stakes_mapping:               # feeds Surprise Engine weight w (SURPRISE_ENGINE.md §2)
  impact_from: customer_impact          # none=1, degraded=2, partial_outage=4, full_outage=5
  irreversibility_hint: [failover, restart_replica, rollback, failover_region]   # costly/irreversible by default
  time_pressure_from: incident_phase    # detection/triage/mitigation => minutes

claim_templates:
  - id: self-resolves
    statement: "The condition resolves without further intervention within {window}."
    core: true
    horizon_bounds: [5m, 24h]
    default_resolve:
      kind: cel
      expr: "obs.primary_symptom.max(claim.horizon - duration(window), claim.horizon) < obs.primary_symptom_threshold"
      inputs: [primary_symptom, primary_symptom_threshold]
    base_rate_ppm: null          # MUST be evidence-backed or null; never invented (DOMAIN_PACKS §2)
  - id: service-recovers
    statement: "Customer-facing error rate returns below {threshold_ppm} ppm within {window} of the chosen action."
    core: true
    horizon_bounds: [5m, 24h]
    default_resolve:
      kind: cel
      expr: "obs.error_rate_ppm.at(t_action + duration(window)) < threshold_ppm"
      inputs: [error_rate_ppm]
    base_rate_ppm: null
  - id: no-regression
    statement: "No recurrence of the incident within {window} after resolution."
    core: false
    horizon_bounds: [1h, 30d]
    default_resolve: { kind: attested, by: self, rubric: "No new incident ticket referencing the same root symptom." }
    base_rate_ppm: null

elicitation_seeds:            # observation-first (SURPRISE_ENGINE.md §6)
  - id: noticed-signal
    prompt: "I expected '{predicted}'. You chose '{chosen}'. What did you notice?"
    choices_from: contrast_signals
    always_include: ["Something else (say it)", "Just a hunch", "Skip"]
  - id: ruled-out
    prompt: "Was there something you ruled out that most people would check first?"
    choices_from: contrast_signals
    always_include: ["Something else (say it)", "Skip"]

observation_providers:        # interface only; concrete connectors ship in integrations
  - { id: prometheus, kind: timeseries }
  - { id: manual,     kind: attested }

redaction_rules:
  - { name: email,      pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}" }
  - { name: ipv4,       pattern: "\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b" }
  - { name: hostname_internal, pattern: "\\b[a-z0-9-]+\\.(internal|corp|local)\\b" }
  - { name: aws_key_id, pattern: "\\bAKIA[0-9A-Z]{16}\\b" }

translations: {}
