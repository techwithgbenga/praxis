# SPDX-License-Identifier: Apache-2.0
[project]
name = "praxis-apprentice"
version = "0.1.0"
description = "Praxis apprentice runtime: retrieval, predictor, calibrator, answer composer (docs/APPRENTICE.md). Isolated process; treated by the Rust kernel as untrusted advice."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "../docs/APPRENTICE.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apprentice"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = ["mypy==1.14.1", "ruff==0.8.6", "pytest==8.3.4"]
