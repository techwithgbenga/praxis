# SPDX-License-Identifier: Apache-2.0
# Runs the single source of truth: `just ci` (see AGENTS.md §2, justfile).
name: ci
on: [push, pull_request]
permissions: { contents: read }

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install just, cargo-deny, cargo-audit, cargo-vet, mdbook
        uses: taiki-e/install-action@v2
        with:
          # mdbook is pinned to 0.4.x: mdbook-linkcheck 0.7.7 (latest as of this
          # writing) speaks the 0.4.x preprocessor/renderer protocol and fails
          # with a CLI-parsing error under mdbook 0.5.x. Bump both together once
          # a compatible mdbook-linkcheck release exists; see mdbook/book.toml.
          tool: just,cargo-deny,cargo-audit,cargo-vet,mdbook@0.4.52,mdbook-linkcheck@0.7.7

      - name: Set up Python (helper scripts)
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: just ci
        run: just ci

  vectors-ts:
    # M1-09 (docs/IMPLEMENTATION_PLAN.md): the independent pure-TS verifier
    # must pass every vector in spec/test-vectors/** too. Runs against the
    # vectors already committed to the repo (generated deterministically by
    # `cargo run -p praxis-validate --example gen_vectors`, M1-08) rather
    # than regenerating them here, so this job needs no Rust toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Enable corepack (pinned pnpm, sdk/ts/*/package.json)
        run: corepack enable

      - name: Install dependencies
        working-directory: sdk/ts
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: sdk/ts
        run: pnpm run lint

      - name: Build
        working-directory: sdk/ts
        run: pnpm run build

      - name: Build verifier
        working-directory: sdk/ts/verifier
        run: pnpm run build

      - name: Run vectors
        working-directory: sdk/ts/verifier
        run: pnpm test

  fuzz-smoke:
    # 60s/target smoke run (EVALUATION.md §5), not the full M1-10 nightly
    # 30-minute soak. Linux only: see crates/praxis-types/fuzz/README.md for
    # why Windows needs a matching standalone ASan runtime this job doesn't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (cargo-fuzz requires it)
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install just, cargo-fuzz
        uses: taiki-e/install-action@v2
        with: { tool: just,cargo-fuzz }

      - run: just fuzz-smoke
