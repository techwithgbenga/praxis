# SPDX-License-Identifier: Apache-2.0
# Runs the single source of truth: `just ci` (see AGENTS.md §2, justfile).
name: ci
on: [push, pull_request]
permissions: { contents: read }

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install just, cargo-deny, cargo-audit, cargo-vet, mdbook
        uses: taiki-e/install-action@v2
        with:
          # mdbook is pinned to 0.4.x: mdbook-linkcheck 0.7.7 (latest as of this
          # writing) speaks the 0.4.x preprocessor/renderer protocol and fails
          # with a CLI-parsing error under mdbook 0.5.x. Bump both together once
          # a compatible mdbook-linkcheck release exists; see mdbook/book.toml.
          tool: just,cargo-deny,cargo-audit,cargo-vet,mdbook@0.4.52,mdbook-linkcheck@0.7.7

      - name: Set up Python (helper scripts)
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: just ci
        run: just ci

  fuzz-smoke:
    # 60s/target smoke run (EVALUATION.md §5), not the full M1-10 nightly
    # 30-minute soak. Linux only: see crates/praxis-types/fuzz/README.md for
    # why Windows needs a matching standalone ASan runtime this job doesn't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (cargo-fuzz requires it)
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install just, cargo-fuzz
        uses: taiki-e/install-action@v2
        with: { tool: just,cargo-fuzz }

      - run: just fuzz-smoke
